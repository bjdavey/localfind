// Dedicated debug NPU packaging script for SM8650 (applied from app/build.gradle.kts).
//
// Why this exists:
// - In Android App Bundles (.aab via `bundleDebug` / `bundleRelease`), Play Feature Delivery
//   packages each SoC's NPU .so libraries from `:litert_npu_runtime_libraries:*` into
//   device-targeted split APKs.
// - During local development (`./gradlew assembleDebug`), Gradle builds a standalone base APK
//   without dynamic-feature splits.
// - When not running a bundle task, this script wires the SM8650 (Hexagon V75) native libraries
//   from `litert_npu_runtime_libraries` and the Qualcomm LiteRT dispatch AAR into the `debug`
//   APK build, keeping `app/src/main/jniLibs` clean and avoiding duplicate .so files.

def isBundleBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("bundle")
}

if (isBundleBuild) {
    android {
        defaultConfig {
            // App Bundle (.aab) requires base and all NPU dynamic-feature modules to share the same ABI set
            ndk {
                abiFilters.add("arm64-v8a")
            }
        }
    }
} else {
    android {
        sourceSets {
            debug {
                jniLibs.srcDirs += [
                    "../litert_npu_runtime_libraries/qualcomm_runtime_common/src/main/jni",
                    "../litert_npu_runtime_libraries/qualcomm_runtime_htp/src/main/jni",
                    "../litert_npu_runtime_libraries/qualcomm_runtime_v75/src/main/jni"
                ]
            }
        }
    }

    dependencies {
        debugImplementation "com.google.ai.edge.litert:litert-npu-runtime-qualcomm:2.3.0"
    }
}
